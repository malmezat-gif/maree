<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#075f90" />
    <title>Marée — Hors connexion</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; }
      * { box-sizing: border-box; }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 28px;
        color: #f2fbfd;
        background:
          radial-gradient(circle at 78% 10%, rgba(170, 232, 239, 0.25), transparent 32%),
          linear-gradient(180deg, #0c83aa, #06496e 58%, #043049);
      }
      main { max-width: 340px; text-align: center; }
      img { width: 92px; height: 92px; border-radius: 25px; box-shadow: 0 18px 38px rgba(1, 25, 39, 0.28); }
      h1 { margin: 22px 0 8px; font-size: 31px; letter-spacing: -0.04em; }
      p { margin: 0; color: rgba(236, 250, 252, 0.72); line-height: 1.5; }
      button {
        min-height: 48px;
        margin-top: 25px;
        padding: 0 20px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 17px;
        color: #073d59;
        background: #eefbfc;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/maree-192.png" alt="" />
      <h1>La mer attend le réseau</h1>
      <p>Reconnectez votre téléphone pour actualiser les prochains horaires de marée.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
